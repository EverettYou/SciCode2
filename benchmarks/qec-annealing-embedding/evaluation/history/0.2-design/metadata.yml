research_question: Construct and validate resource-efficient quadratic encodings and minor embeddings
  of check-matrix-defined quantum decoding problems on D-Wave Advantage2 connectivity, and determine which
  formulation and embedding choices remain favorable under hardware constraints.
scientific_domain:
- quantum error correction
- quantum annealing
- graph minor embedding
expected_outcomes:
- A representation with fewer logical variables may require more physical qubits or a worse usable coefficient
  scale.
- A reproducible resource frontier or documented capacity limitation can guide later QPU experiments.
- Periodic boundaries and logical degeneracy may materially alter the correct formulation and embedding
  cost.
expected_outputs:
- A faithful matrix-to-QUBO construction and independently valid Advantage2 embeddings.
- A matched-budget resource comparison and portable technical-review package.
- Reusable source code and an evidence-backed English research note.
evidence_requirements:
- Exact small-case ground-state projection, syndrome and logical-equivalence checks.
- Independent embedding and physical-coefficient validation on versioned graphs.
- Separate controlled formulation, embedding and sample-recovery comparisons.
