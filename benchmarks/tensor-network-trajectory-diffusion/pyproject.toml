[project]
name = "tensor-network-trajectory-diffusion"
version = "0.1.0"
description = "Independent numerical environment for the trajectory-diffusion benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
    "autoray>=0.8,<0.9",
    "cotengra>=0.7,<0.8",
    "numba>=0.61,<0.62",
    "numpy>=2.0,<2.3",
    "quimb==1.11.2",
    "torch>=2.7,<3",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false
