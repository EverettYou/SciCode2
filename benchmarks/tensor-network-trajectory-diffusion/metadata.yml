expert_notes: 'Lab 001 is complete and restricted to N=1,2 dense-baseline and interface qualification.
  Closed checkpoint T-0006 approves only the state-aware dense N=3, R=2 Lab 002 design with complementary
  resource panels, staged numerical gates, and conditional locality criteria. Lab 002 itself remains dense-only.
  Separately, MPS execution at N=1,2,3 is authorized as a no-effective-truncation dense-parity correctness
  suite; it must reproduce states, probabilities, reverse updates, losses, gradients, and fixed-budget training
  behavior before large-N use. Truncation, size transfer, spatial sharing, Hamiltonian heads, and scaling claims
  remain controlled follow-on work.'
