research_question: How do the decodable regions of syndrome-only, Z(N)-charge and full SU(N)-irrep records depend on p and N for hidden-orientation SU(N) pair errors on a honeycomb patch, and is every p decodable from irrep records at large N?
scientific_domain:
- quantum error correction
- symmetry-informed decoding
- statistical inference
expected_outcomes:
- The three records are nested, so their decodable regions are nested at each N.
- The Z(N)-charge boundary may saturate at finite N, while the SU(N)-irrep boundary keeps moving with N; the (p, N) diagram makes the value of each level of symmetry knowledge explicit.
