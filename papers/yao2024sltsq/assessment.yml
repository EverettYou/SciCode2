paper_id: yao2024sltsq
title: 'Shadowgpt: Learning to solve quantum many-body problems from randomized measurements'
authors: Jian Yao, Yi-Zhuang You
year: 2024
source_url: https://arxiv.org/abs/2411.03285
research_area:
- quantum many-body physics
- classical shadows
- scientific machine learning
summary: We propose ShadowGPT, a novel approach for solving quantum many-body problems by learning from
  randomized measurement data collected from quantum experiments. The model is a generative pretrained
  transformer (GPT) trained on simulated classical shadow data of ground states of quantum Hamiltonians,
  obtained through randomized Pauli measurements. Once trained, the model can predict a range of ground
  state properties across the Hamiltonian parameter space. We demonstrate its effectiveness on the transverse-field
  Ising model and the cluster-Ising model, accurately predicting ground state energy, correlation functions,
  and entanglement entropy. This approach highlights the potential of combining quantum data with classical
  machine learning to address complex quantum many-body challenges.
computational_core: Train a conditional autoregressive model on randomized Pauli measurement strings from parameterized Hamiltonians, then predict ground-state energies, correlations, and entanglement observables across held-out couplings or models.
