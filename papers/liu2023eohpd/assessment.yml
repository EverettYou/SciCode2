followup_ideas:
- Construct an enumerable synthetic input space with controllable rare regions and measure estimator bias as the space becomes harder to enumerate.
- Compare gradient-based, random, and stratified proposals under a fixed human-labeling budget.
potential_pitfalls:
- Model-guided sampling can overrepresent easy or adversarial regions and invalidate naive PR estimates.
- Human labels or synthetic proxies must be defined independently of the model being evaluated.
- Effective sample size and uncertainty intervals matter more than a single estimated curve.
