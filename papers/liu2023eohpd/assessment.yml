ai_assessment: Potentially very interesting for a benchmark about evaluating models beyond fixed datasets. The paper provides a clear estimator-design problem and an enumerable setting for validation, but the benchmark must avoid becoming a generic ML exercise by fixing a scientifically meaningful input generator and requiring calibration, failure analysis, and comparison to known ground truth.
