ai_assessment: Strong candidate for a controlled computational task because the paper provides analytic
  recovery channels, exact low-qubit trajectory tests, and a 10-qubit local-Petz reference, while extending
  the simulation beyond small state vectors requires real quantum-information and numerical judgment.
  The solver-facing formulation should keep the formalism focused on implementable recovery methods and
  scientifically meaningful validation checks.
