followup_ideas:
- Scale trajectory-level reverse diffusion from the paper's one- and two-qubit state-vector demonstrations
  to low-entanglement one-dimensional chains using matrix-product states. On the same weak-measurement
  protocol, construct local reduced density matrices from the MPS and compare the ensemble-average recovery
  against local Petz recovery as system size, correlation length, and bond dimension vary; report local-observable
  recovery and runtime scaling.
- 'Build an exact-to-local validation ladder on short one-dimensional chains: compare local Petz recovery
  with the exact global Petz map while varying correlation length and recovery-window size. Use fidelity
  and trace distance in this tractable regime to calibrate the local-recovery implementation before MPS
  scale-up.'
potential_pitfalls:
- Violating complete positivity or normalization in a discretized recovery map.
- Numerical error can be hidden by comparing only low-order observables.
- Directly comparing a single pure trajectory recovered by the control Hamiltonian with local Petz output,
  which is an ensemble-average mixed state. Compare matched ensemble averages or local observables instead.
