paper_id: zhang2026qprol
title: Quantum Process Realization of LDPC Code Dualities and Product Constructions
authors: Shuhan Zhang, Deepak Aryal, Yi-Zhuang You
year: 2026
source_url: https://arxiv.org/abs/2603.13538
research_area:
- quantum error-correcting codes
- quantum circuits
- ZX calculus
summary: We realize a broad class of code constructions, including Kramers-Wannier duality, tensor product,
  and check product, as quantum processes consisting of ancilla initialization, local unitaries, and projective
  measurements. Using ZX-calculus, we represent these transformations diagrammatically and provide a systematic
  algorithm for extracting quantum circuits. Central to our framework is the observation that the physical
  content of a classical LDPC code is captured by the operator algebra associated with its Tanner graph,
  and that code transformations correspond to maps between such algebras. Kramers-Wannier duality then
  admits a natural interpretation as gauging, while tensor and check products correspond to coupled-layer
  constructions in which interlayer coupling and projection implement a quotient on stacked operator algebras.
  Together, these results establish a unified framework connecting code transformations, quantum circuits,
  and mappings between distinct quantum phases of matter.
computational_core: Convert LDPC-code algebraic constructions into quantum processes, extract circuits from operator relations, and verify the resulting maps on small Tanner graphs and exactly solvable code families.
