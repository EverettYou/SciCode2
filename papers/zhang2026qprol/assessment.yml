followup_ideas:
- Implement and compare circuit extraction for a small family of tensor, check, and gauging products with independent stabilizer verification.
- Search for a new small Tanner-graph construction whose process has a prescribed logical action and quantify ancilla and depth overhead.
potential_pitfalls:
- Equivalent stabilizer or ZX representations can obscure whether two extracted processes really implement the same map.
- Boundary conventions and qubit ordering are easy sources of silent circuit errors.
- A benchmark should constrain graph sizes enough to keep exhaustive verification feasible.
