ai_assessment: Promising but technically demanding benchmark candidate. It naturally requires translation between algebra, graph structure, and executable circuits, with exact stabilizer checks available for validation. The task should use small, fully specified graph families and ask for a nontrivial new construction rather than a literature transcription.
