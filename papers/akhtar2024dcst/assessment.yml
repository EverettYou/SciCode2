paper_id: akhtar2024dcst
title: Dual-unitary classical shadow tomography
authors: Ahmed A Akhtar, Namit Anand, Jeffrey Marshall, Yi-Zhuang You
year: 2024
source_url: https://arxiv.org/abs/2404.01068
research_area:
- dual-unitary circuits
- operator spreading
- classical shadows
summary: 'The dynamics of quantum information in closed, thermalizing systems is a core to our understanding
  of quantum manybody physics [1–3]. In thermalizing quantum systems, local quantum information is scrambled
  between constituent components and the entanglement exhibits volume-law scaling. Initially localized
  operators spread ballistically and their evolution across space and time can be used to define various
  measures of information propagation, such as the out-of-timeorder (OTOC) correlator [4–12]. The physics
  of these systems is often contrasted with the phenomena of many-body localization, where a closed, interacting
  many-body quantum system can evade thermalization, and local quantum information can escape global scrambling
  [13]. Rather than studying localization, however, our focus in this paper is restricted to thermalizing
  systems generated by dual-unitary circuits. Dual-unitary circuits are fast-scrambling circuits that
  produce chaotic dynamics and furthermore have a symmetry that enables efficient calculation of observables
  [14]. Our primary object of study is the Pauli weight of an operator. The Pauli weight of a fixed operator
  O characterizes how much of it is distributed over different Pauli strings: wO (P)= Tr (OP) 2, where
  P=⊗ i Pi is a Pauli string ie a product of local Pauli operators Pi∈{1, X, Y, Z}. By studying the evolution
  of the Pauli weight over time and over different Pauli strings, we can analyze how quantum information
  spreads over space and time, similar to previous works on the operator spreading in random unitary circuits
  [15–33]. The Pauli weight is also interesting from the perspective of classical shadow …'
computational_core: Simulate Pauli-weight dynamics in dual-unitary circuits, estimate operator-spreading and shadow-norm observables, and compare finite-depth numerics against solvable or mean-field scaling predictions.
