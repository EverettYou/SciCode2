followup_ideas:
- Infer the crossover between ballistic spreading and finite-size saturation from several circuit families and depths.
- Design a perturbation away from exact dual unitarity and test which observables retain the predicted scaling.
potential_pitfalls:
- Finite circuit depth and bond dimension can mimic asymptotic scaling over too narrow a window.
- Pauli-weight normalization and operator-string conventions must be kept consistent across implementations.
- A fit to a power law without uncertainty or finite-size analysis is not sufficient evidence for the claimed regime.
