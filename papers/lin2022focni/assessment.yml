ai_assessment: A compact and attractive benchmark seed. It has a self-contained random-matrix model, topological outputs with strong invariants, and a natural extension axis through ensemble choice and band number. The scientific difficulty is concentrated in robust point tracking and validation, making it suitable for a shorter workstation-scale task.
