ai_assessment: Strong benchmark candidate because it offers exact small-system references, multiple competing methods, and a scientifically meaningful bias–variance tradeoff. It is feasible on a workstation if the task uses modest stabilizer codes and requires careful resource accounting rather than reproducing the paper's largest demonstrations.
