followup_ideas:
- Compare logical-shadow mitigation with virtual distillation and subspace expansion under correlated rather than independent depolarizing noise.
- Optimize the logical observable and shot allocation under a fixed sampling budget, reporting both bias and variance.
potential_pitfalls:
- A method can reduce bias while increasing variance or post-processing instability.
- Results depend strongly on the code, decoder, noise channel, and logical observable.
- Small-code simulations may not predict the resource scaling of larger encoded systems.
