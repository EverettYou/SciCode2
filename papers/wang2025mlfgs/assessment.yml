paper_id: wang2025mlfgs
title: Machine Learning for Ground State Preparation via Measurement and Feedback
authors: Chuanxin Wang, Yi-Zhuang You
year: 2025
source_url: https://arxiv.org/abs/2502.06517
research_area:
- quantum state preparation
- reinforcement learning
- measurement and feedback
summary: We present a recurrent neural network-based approach for ground state preparation utilizing mid-circuit
  measurement and feedback. Unlike previous methods that use machine learning solely as an optimizer,
  our approach dynamically adjusts quantum circuits based on real-time measurement outcomes and learns
  distinct preparation protocols for different Hamiltonians. Notably, our machine learning algorithm consistently
  identifies a state preparation strategy wherein all initial states are first steered toward an intermediate
  state before transitioning to the target ground state. We demonstrate that performance systematically
  improves as a larger fraction of ancilla qubits are utilized for measurement and feedback, highlighting
  the efficacy of mid-circuit measurements in state preparation tasks.
computational_core: Train a recurrent policy to choose measurement-feedback circuit actions for preparing ground states, then evaluate energy, fidelity proxies, robustness to initial states, and generalization across Hamiltonian parameters.
