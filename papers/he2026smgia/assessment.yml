followup_ideas:
- Test how a controlled symmetry-preserving perturbation changes the direct transition versus an intermediate
  excitonic phase.
- Construct a smaller sign-problem-free variant whose critical exponents can be estimated with multiple
  finite-size scaling windows.
potential_pitfalls:
- Critical exponents can be biased by small system sizes and correction-to-scaling terms.
- A finite-size gap closing can be mistaken for a continuous transition.
- Absence of a detected order parameter is not proof of absence without a systematic symmetry analysis.
