<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../static/js/redirect-to-dashboard.js"></script>
  <script defer src="../static/js/site-shell.js?v=20260823-4"></script>
  <title>Document · Paper to Benchmark</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="../static/css/style.css?v=20260823-89">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="../static/js/document.js?v=20260823-4"></script>
</head>
<body data-page="benchmark-document">
  <div id="site-header"></div>
  <main class="document-shell">
    <div class="document-navigation">
      <div class="document-navigation-leading">
        <a id="document-back" class="document-back" href="benchmarks.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>Back to benchmarks</span></a>
      </div>
      <a id="document-raw" class="document-raw-link" href="#" target="_blank" rel="noreferrer"><i class="fa-regular fa-file-code" aria-hidden="true"></i>View raw</a>
    </div>
    <header class="document-header">
      <div>
        <p id="document-kind" class="panel-kicker">MARKDOWN DOCUMENT</p>
        <h1 id="document-title">Loading document…</h1>
        <p id="document-path" class="document-path"></p>
      </div>
    </header>
    <section id="document-properties" class="document-properties" aria-label="Document properties" hidden></section>
    <div class="document-layout">
      <aside id="document-outline" class="document-outline" aria-label="Document outline">
        <button id="document-outline-toggle" class="document-outline-toggle" type="button" aria-controls="document-outline" aria-expanded="true" aria-label="Hide document outline" title="Hide document outline"><i class="fa-solid fa-bars-staggered" aria-hidden="true"></i></button>
        <p>On this page</p>
        <nav id="document-toc"></nav>
      </aside>
      <article id="document-content" class="document-article" aria-live="polite">
        <p class="document-loading">Loading Markdown…</p>
      </article>
    </div>
  </main>
</body>
</html>
